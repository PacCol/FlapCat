<!DOCTYPE html>
<html lang="fr" translate="no">

<head>
    <title>Connexion - FlapCat</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <link rel="stylesheet" href="RealCSS/fonts/material-design-icons/material-design-icons-round.css">

    <link rel="stylesheet" href="RealCSS/fonts/montserrat/montserrat.css">

    <link rel="stylesheet" href="RealCSS/all.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="app">

        <div id="main-container">

            <h1>Connexion</h1>

            <div id="username-side">
                <div class="modern-input primary">
                    <input type="email" id="email-input" placeholder=" " autocomplete="off">
                    <p>Entrez votre adresse email</p>
                </div>
                <button class="btn btn-sp primary ripple-effect" id="next">Suivant</button>
                <div style="clear: both;"></div>
            </div>

            <div id="password-side">
                <div class="modern-input primary">
                    <input type="password" id="password-input" maxlength="20" placeholder=" " autocomplete="off">
                    <p>Entrez votre mot de passe</p>
                </div>

                <input class="checkbox-input" id="show-passwd" type="checkbox" style="display: none">
                <label class="checkbox-box primary" for="show-passwd"><span>
                        <svg viewbox="0 0 12 10">
                            <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
                        </svg></span>
                    <p>Afficher le mot de passe</p>
                </label>

                <button class="btn btn-ol primary ripple-effect" id="back">Retour</button>
                <button class="btn btn-sp primary ripple-effect" id="login">Connexion</button>
            </div>

        </div>
    </div>

    <script src="RealCSS/jquery.min.js"></script>

    <script src="RealCSS/all.min.js"></script>

    <script src="js/login.js"></script>

</body>
