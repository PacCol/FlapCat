<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Connexion - FlapCat</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

    <meta name="viewport" content="width=device-width, user-scalable=no">

    <link rel="stylesheet" href="RealCSS/fonts/material-design-icons/material-design-icons-round.css">

    <link rel="stylesheet" href="RealCSS/fonts/montserrat/montserrat.css">

    <link rel="stylesheet" href="RealCSS/all.min.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div id="main-container">

        <h1>Connexion</h1>

        <div id="username-side">
            <div class="modern-input">
                <input type="text" id="username-input" placeholder=" " autocomplete="off">
                <p>Entrez votre adresse email</p>
            </div>
            <button class="btn btn-secondary" onclick="window.location.replace('signup.html');">Créer un compte</button>
            <button class="btn btn-primary" id="next">Suivant</button>
            <div style="clear: both;"></div>
        </div>

        <div id="password-side">
            <div class="modern-input">
                <input type="password" id="password-input" placeholder=" " autocomplete="off">
                <p>Enter votre mot de passe</p>
            </div>
            <button class="btn btn-secondary" id="back">Retour</button>
            <button class="btn btn-primary" id="login">Connexion</button>
        </div>
    </div>

    <script src="js/lib/jquery.min.js"></script>

    <script src="js/login.js"></script>
    <script src="js/network-error.js"></script>
    <script src="RealCSS/all.min.js"></script>

</body>
